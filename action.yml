---
name: action-controlrepo-pdk-tests
description: Runs `pdk validate` and `pdk test unit` on your control repo
inputs:
  puppet-version:
    description: A string indicating the Puppet version to validate against, such as "5.4.2" or "5.5".
    required: false
  pdk-image:
    description: A string indicating the docker image to build from, such as "puppet/pdk:3.0.0.0".
    required: false
  site-module-path:
    description: e.g. site_modules
    required: false
  pdk_options:
    description: additional command-line flags and options for both PDK commands
    required: false
branding:
  icon: check-square
  color: orange
runs:
  using: docker
  image: Dockerfile
  env:
    PUPPET_VERSION: ${{ inputs.puppet-version }}
    PDKIMAGE: ${{ inputs.pdk-image }}
    SITE_MODULE_PATH: ${{ inputs.site-module-path }}
    PDK_OPTIONS:  ${{ inputs.pdk_options }}
