name: Action Smoke Test

on:
  - push
  - pull_request
    # Allows you to run this workflow manually from the Actions tab
  - workflow_dispatch

jobs:
  smoke_22-04:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Create test controlrepo
        run: |
          mkdir -p controlrepo/manifests
          mkdir -p controlrepo/site/profiles/manifests
          mkdir -p controlrepo/site/roles/manifests

          cat > controlrepo/Puppetfile <<'EOF'
          EOF

          cat > controlrepo/manifests/site.pp <<'EOF'
          notify { 'hello': }
          EOF

          cat > controlrepo/site/profiles/metadata.json <<'EOF'
          {
            "name": "threepistons-profiles",
            "version": "0.1.0",
            "author": "threepistons",
            "license": "Apache-2.0",
            "source": "",
            "dependencies": []
          }
          EOF

          cat > controlrepo/site/roles/metadata.json <<'EOF'
          {
            "name": "threepistons-roles",
            "version": "0.1.0",
            "author": "threepistons",
            "license": "Apache-2.0",
            "source": "",
            "dependencies": []
          }
          EOF

      - name: Test the action
        uses: ./
        with:
          puppet-version: 7.23.0
          site-module-path: controlrepo/site

  smoke_24-04:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Create test controlrepo
        run: |
          mkdir -p controlrepo/manifests
          mkdir -p controlrepo/site/profiles/manifests
          mkdir -p controlrepo/site/roles/manifests

          cat > controlrepo/Puppetfile <<'EOF'
          EOF

          cat > controlrepo/manifests/site.pp <<'EOF'
          notify { 'hello': }
          EOF

          cat > controlrepo/site/profiles/metadata.json <<'EOF'
          {
            "name": "threepistons-profiles",
            "version": "0.1.0",
            "author": "threepistons",
            "license": "Apache-2.0",
            "source": "",
            "dependencies": []
          }
          EOF

          cat > controlrepo/site/roles/metadata.json <<'EOF'
          {
            "name": "threepistons-roles",
            "version": "0.1.0",
            "author": "threepistons",
            "license": "Apache-2.0",
            "source": "",
            "dependencies": []
          }
          EOF

      - name: Test the action
         uses: ./
         with:
           puppet-version: 7.23.0
           site-module-path: controlrepo/site
